name: build-worker

# Builds ghcr.io/yoyoithink/warmbly-worker:<tag> for every official Warmbly
# release tag >= MIN_TAG. The image is the official worker plus
# patches/0001-netease-status-examine-fallback.patch.
#
# Fail-loud rules:
#   * the patch must apply to the tag, or the job fails and nothing is published;
#   * gofmt, go vet and the whole IMAP test package must pass on the patched tree;
#   * an existing tag in GHCR is never overwritten (unless "force" is set by hand);
#   * if the regression test already passes on the pristine tag, upstream has
#     fixed the bug: the official image is mirrored under our name unmodified.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Official release tag to build (e.g. v0.6.60). Empty = every missing tag."
        required: false
        default: ""
      force:
        description: "Rebuild even if the tag already exists in GHCR"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-worker.yml"
      - "patches/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-worker
  cancel-in-progress: false

env:
  UPSTREAM: warmbly/warmbly
  MIN_TAG: v0.6.60
  IMAGE: ghcr.io/yoyoithink/warmbly-worker
  OFFICIAL_IMAGE: ghcr.io/warmbly/warmbly/worker

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - name: Pick the tags to build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            candidates="${INPUT_TAG}"
          else
            candidates="$(gh api "repos/${UPSTREAM}/releases" --paginate \
              --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -u)"
          fi
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          todo=()
          for t in ${candidates}; do
            # >= MIN_TAG
            if [ "$(printf '%s\n%s\n' "${MIN_TAG}" "${t}" | sort -V | head -n1)" != "${MIN_TAG}" ]; then
              continue
            fi
            if [ "${FORCE}" != "true" ] && docker buildx imagetools inspect "${IMAGE}:${t}" >/dev/null 2>&1; then
              echo "have ${t}"
              continue
            fi
            todo+=("${t}")
          done
          json="$(printf '%s\n' "${todo[@]:-}" | jq -R . | jq -sc 'map(select(length>0))')"
          echo "to build: ${json}"
          echo "tags=${json}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.tags != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        tag: ${{ fromJSON(needs.discover.outputs.tags) }}
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patch

      - name: Checkout official source at ${{ matrix.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ matrix.tag }}
          path: src

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Probe the pristine tag for the bug
        id: probe
        working-directory: src
        run: |
          set -uo pipefail
          # Only the regression test goes in; the source stays pristine.
          git apply --include='*_test.go' ../patch/patches/0001-netease-status-examine-fallback.patch
          if go test -count=1 -run MaskedStatus ./internal/client/smtpimap/imap/ ; then
            echo "fixed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Regression test PASSES on pristine ${{ matrix.tag }}: upstream already fixed it."
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "Regression test FAILS on pristine ${{ matrix.tag }} (bug present, as expected)."
          fi

      - name: Apply the source patch
        if: steps.probe.outputs.fixed == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          git apply --check --exclude='*_test.go' ../patch/patches/0001-netease-status-examine-fallback.patch
          git apply --exclude='*_test.go' ../patch/patches/0001-netease-status-examine-fallback.patch
          git diff --stat

      - name: gofmt, vet, tests on the patched tree
        if: steps.probe.outputs.fixed == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l internal/client/smtpimap/imap)"
          if [ -n "${unformatted}" ]; then echo "gofmt needed:"; echo "${unformatted}"; exit 1; fi
          go vet ./internal/client/smtpimap/...
          go test -count=1 ./internal/client/smtpimap/...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build info
        id: info
        working-directory: src
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push the patched worker
        if: steps.probe.outputs.fixed == 'false'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/deploy/docker/worker.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          build-args: |
            VERSION=${{ matrix.tag }}
            COMMIT=${{ steps.info.outputs.commit }}
            BUILT_AT=${{ steps.info.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/yoyoithink/warmbly-worker-patch
            org.opencontainers.image.description=Warmbly worker ${{ matrix.tag }} plus netease-status-examine-fallback
            org.opencontainers.image.version=${{ matrix.tag }}
            io.github.yoyoithink.upstream-tag=${{ matrix.tag }}
            io.github.yoyoithink.upstream-commit=${{ steps.info.outputs.commit }}
            io.github.yoyoithink.patch=netease-status-examine-fallback

      - name: Upstream already fixed - mirror the official image unmodified
        if: steps.probe.outputs.fixed == 'true'
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${{ matrix.tag }}" "${OFFICIAL_IMAGE}:${{ matrix.tag }}"

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.tag }}"
            echo ""
            echo "- upstream commit: \`${{ steps.info.outputs.commit }}\`"
            if [ "${{ steps.probe.outputs.fixed }}" = "true" ]; then
              echo "- **upstream already fixes the bug**; official image mirrored unmodified (the patch is no longer needed for this tag)"
            else
              echo "- bug reproduced on pristine tag (regression test failed), patch applied, gofmt/vet/tests green"
              echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            fi
            echo "- image: \`${IMAGE}:${{ matrix.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
